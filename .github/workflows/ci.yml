name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run verify -- --max-search-shard-bytes 5000000
      - run: npm run check:package
      - name: Build and verify Cloudflare Pages output
        run: |
          CF_PAGES=1 npm run build
          npm run verify -- --max-search-shard-bytes 5000000
