# Dokploy adds the domain's Traefik labels and network when you deploy.
services:
  geo-data-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
    expose:
      - "3000"
    restart: unless-stopped
    stop_grace_period: 20s
